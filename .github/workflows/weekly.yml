name: Weekly merchant opportunities

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/test-weekly-trigger"
  schedule:
    # 02:00 UTC = 10:00 Asia/Shanghai. Queue 30 minutes early to absorb
    # ordinary GitHub Actions schedule delays and target delivery by 10:30.
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate card
        run: python bot.py weekly --preview > /dev/null
      - name: Send weekly card
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python bot.py weekly
